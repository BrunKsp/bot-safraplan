name: Deploy bot-safraplan

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/brunksp/bot-safraplan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          ENV_FILE: ${{ secrets.BOT_ENV_FILE }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          echo "GHCR_PAT length: ${#GHCR_PAT}"
          echo "ENV_FILE length: ${#ENV_FILE}"

          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" "mkdir -p /opt/safraplan/bot-safraplan"

          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cat > /opt/safraplan/bot-safraplan/.env" <<< "$ENV_FILE"

          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "docker login ghcr.io -u brunksp --password-stdin" <<< "$GHCR_PAT"

          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd /opt/safraplan/infra && \
             docker compose pull bot && \
             docker compose up -d bot && \
             docker image prune -f"
